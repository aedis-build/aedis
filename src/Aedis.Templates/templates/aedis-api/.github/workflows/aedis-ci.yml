# CI do app: o pipeline único do Aedis Platform (aedis-ci). Conventional Commits, testes com cobertura e gate, SAST
# (Semgrep + regras Aedis), CodeQL e REUSE. A imagem assinada sai do release.yml, em tag vX.Y.Z.
name: aedis-ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

permissions: {}

jobs:
  aedis:
    uses: aedis-build/aedis-platform/.github/workflows/aedis-ci.yml@820bfc78a548c3fcc98a5b9e303c93fa3a368243 # main
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
      id-token: write
    with:
      language: dotnet
      solution: Aedis.App1.slnx
      min-line: 60
      platform-ref: 820bfc78a548c3fcc98a5b9e303c93fa3a368243
