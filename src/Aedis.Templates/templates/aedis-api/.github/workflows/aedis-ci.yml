# CI do app: o pipeline único do Aedis Platform (aedis-ci). Conventional Commits, testes com cobertura e gate, SAST
# (Semgrep + regras Aedis), CodeQL e REUSE. A imagem assinada sai do release.yml, em tag vX.Y.Z.
name: aedis-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

# Uma execução por pull request: um push novo ou fechar o PR cancela a que está rodando. Push na main e o
# agendamento nunca dividem grupo (run_id), então essas execuções sempre terminam.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  aedis:
    if: github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/aedis-ci.yml@820bfc78a548c3fcc98a5b9e303c93fa3a368243 # main
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
      id-token: write
    with:
      language: dotnet
      solution: Aedis.App1.slnx
      min-line: 60
      platform-ref: 820bfc78a548c3fcc98a5b9e303c93fa3a368243
