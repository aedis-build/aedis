# Release do framework: versão semver derivada dos Conventional Commits; empacotamento, assinatura (cosign keyless),
# SBOM SPDX, proveniência (SLSA Build L3, atestada pelo workflow reutilizável release-nuget do Aedis Platform) e
# publicação ficam no workflow reutilizável. Dispare manualmente para cortar a próxima versão, ou empurre uma tag vX.Y.Z.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Incremento (auto = pelos commits desde a última tag)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  cut:
    name: Próxima versão pelos commits
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Calcular e empurrar a tag
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
          range="$([ "$last" = v0.0.0 ] && echo HEAD || echo "$last..HEAD")"
          log="$(git log --format='%s%n%b' $range)"
          bump="$BUMP"
          if [ "$bump" = auto ]; then
            if echo "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE'; then bump=major
            elif echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then bump=minor
            else bump=patch; fi
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "última $last → $tag ($bump)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "release $tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    name: Empacotar, assinar, atestar e publicar (SLSA Build L3)
    needs: [cut]
    if: always() && (github.event_name == 'push' || needs.cut.result == 'success')
    uses: aedis-build/aedis-platform/.github/workflows/release-nuget.yml@6e5c3235f49e9a037246c1c84e4800e326386ca6 # main (#39)
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.cut.outputs.tag || github.ref_name }}
      solution: Aedis.slnx
      artifact-name: aedis
      # NuGet público fica para depois do site e da primeira release: ligar junto com o secret NUGET_API_KEY.
      publish-nuget: false
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
