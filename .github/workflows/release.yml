# Release do framework: versão semver derivada dos Conventional Commits, pacotes NuGet assinados (cosign
# keyless), SBOM SPDX e proveniência (attestation) — o que a régua L2/L3 pede em Signed-Releases, SBOM e
# proveniência. Dispare manualmente para cortar a próxima versão, ou empurre uma tag vX.Y.Z.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Incremento (auto = pelos commits desde a última tag)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  cut:
    name: Próxima versão pelos commits
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Calcular e empurrar a tag
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
          range="$([ "$last" = v0.0.0 ] && echo HEAD || echo "$last..HEAD")"
          log="$(git log --format='%s%n%b' $range)"
          bump="$BUMP"
          if [ "$bump" = auto ]; then
            if echo "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE'; then bump=major
            elif echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then bump=minor
            else bump=patch; fi
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "última $last → $tag ($bump)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "release $tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    name: Empacotar, assinar, atestar e publicar
    needs: [cut]
    if: always() && (github.event_name == 'push' || needs.cut.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.cut.outputs.tag || github.ref_name }}
      FEED: ${{ github.workspace }}/artifacts/feed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.cut.outputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Empacotar com a versão da tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dotnet pack Aedis.slnx -c Release -o "$FEED" -p:Version="$version" -p:ContinuousIntegrationBuild=true --nologo
          ls "$FEED"
      - name: SBOM (SPDX) dos pacotes
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: artifacts/feed
          format: spdx-json
          output-file: artifacts/aedis-${{ env.TAG }}.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Assinar pacotes e SBOM (cosign keyless)
        run: |
          set -euo pipefail
          for f in "$FEED"/*.nupkg artifacts/aedis-"$TAG".spdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Proveniência (attestation SLSA)
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/feed/*.nupkg
      - name: Bundle de proveniência como asset da release (Scorecard Signed-Releases lê *.intoto.jsonl)
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" artifacts/aedis-"$TAG".intoto.jsonl
      - name: Publicar no NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "$FEED"/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: GitHub Release com pacotes, assinaturas e SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag \
            "$FEED"/*.nupkg "$FEED"/*.sigstore.json artifacts/aedis-"$TAG".spdx.json artifacts/aedis-"$TAG".spdx.json.sigstore.json             artifacts/aedis-"$TAG".intoto.jsonl
