# Pipeline único de qualidade do framework: chama o aedis-ci do Aedis Platform (Conventional Commits, build + testes
# com cobertura e gate 95/85, Codecov, SAST, CodeQL, REUSE). O conteúdo do pipeline é da plataforma; aqui ficam só o
# gatilho, as permissões e os parâmetros do repositório. Em PR roda para qualquer base, para as PRs empilhadas
# também serem validadas; o agendamento semanal reexecuta CodeQL e SAST sobre o código parado.
name: aedis-ci

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "23 5 * * 2"

# Uma execução por pull request: um push novo ou fechar o PR cancela a que está rodando. Push na main e o
# agendamento nunca dividem grupo (run_id), então essas execuções sempre terminam.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  aedis:
    if: github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/aedis-ci.yml@9e9de9827e398a7317a2b9408f665e407ad855e1 # main (#38)
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
      id-token: write
    with:
      language: dotnet
      solution: Aedis.slnx
      dotnet-version: 10.0.x
      min-line: 95
      min-branch: 85
      codecov: true
      test-env: |
        AEDIS_SQLSERVER_IT=1
        AEDIS_AWS_IT=1
        AEDIS_VAULT_IT=1
        AEDIS_IBMMQ_IMAGE=ghcr.io/aedis-build/aedis-dotnet/ibm-mq:10.0.1.0
      platform-ref: 9e9de9827e398a7317a2b9408f665e407ad855e1
