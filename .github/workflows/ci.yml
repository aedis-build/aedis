# CI do framework: build + testes com cobertura e gate (coverage.yml do Aedis Platform), Conventional Commits.
# Actions pinadas por SHA; permissions mínimas; sem credenciais de longa duração.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  commits:
    if: github.event_name == 'pull_request'
    uses: aedis-build/aedis-platform/.github/workflows/conventional-commits.yml@33c000e3effbd9151212c77aa29c24646ec6e5dc # v1
    permissions:
      contents: read

  build-test:
    name: Build + testes + cobertura
    uses: aedis-build/aedis-platform/.github/workflows/coverage.yml@33c000e3effbd9151212c77aa29c24646ec6e5dc # v1
    permissions:
      contents: read
      packages: read
    with:
      solution: Aedis.slnx
      dotnet-version: 10.0.x
      # Mínimo aceitável do framework: 95 % de linhas. Hoje a suíte cobre ~55 % (mesclado, sem os containers de
      # integração); o check fica vermelho até os pacotes abaixo do piso ganharem testes ou perderem código em excesso.
      min-line: 95
      min-branch: 85
      # Suítes de integração opt-in (Testcontainers: SQL Server, LocalStack, Vault) ligadas no CI.
      test-env: |
        AEDIS_SQLSERVER_IT=1
        AEDIS_AWS_IT=1
        AEDIS_VAULT_IT=1
        AEDIS_IBMMQ_IMAGE=ghcr.io/aedis-build/aedis-dotnet/ibm-mq:10.0.1.0

  reuse:
    name: REUSE (licença e copyright em todo arquivo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==5.0.2 lint
