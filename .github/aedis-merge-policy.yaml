# Política do portão de merge (aedis-build/aedis-platform merge-gate.yml). Lida sempre do branch padrão; o que não
# está aqui exige um humano.
schema: aedis.platform/merge-policy/v1
# Bots entre aspas: os colchetes de "[bot]" quebram a lista em YAML.
trustedAuthors: [jeffersonnlucas, "aedis-agent-coder[bot]"]
# Só membros deste time contam como a revisão humana que os caminhos abaixo exigem (lido pela App do portão).
maintainersTeam: maintainers
humanRequiredPaths:
  - ".github/**"
  - CODEOWNERS
  - SECURITY.md
  - LICENSE
  - "LICENSES/**"
  - REUSE.toml
  - Directory.Build.props
  - Directory.Packages.props
  - "src/Aedis.Security*/**"
  - "src/Aedis.Signing*/**"
requiredSummaries: [coverage-summary, sast-summary]
coverageNoRegression: true
maxChangedLines: 2000
allowBreaking: false
mergeMethod: squash
